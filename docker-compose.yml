services:
  app:
    build: .
    container_name: portaledipendenti
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - app_data:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - portaledipendenti_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.portaledipendenti.rule=Host(`portaledipendenti.andreaops.dev`)"
      - "traefik.http.routers.portaledipendenti.entrypoints=websecure"
      - "traefik.http.routers.portaledipendenti.tls.certresolver=myresolver"
      - "traefik.http.services.portaledipendenti.loadbalancer.server.port=80"

  db:
    image: mysql:8
    container_name: portaledipendenti-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portaledipendenti_net
    labels:
      - "traefik.enable=false"

networks:
  web:
    external: true
  portaledipendenti_net:

volumes:
  app_data:
  storage_data:
  db_data:
